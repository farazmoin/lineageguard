[project]
name = "lineageguard"
version = "0.1.0"
description = "Metadata-aware SQL change reviewer powered by DataHub lineage + an AI agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "acryl-datahub[datahub-rest]>=1.3.0",
    "sqlglot>=25.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
lineageguard = "lineageguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lineageguard"]
